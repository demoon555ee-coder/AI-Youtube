services:
  api:
    build: .
    env_file:
      - .env.supabase-staging
    environment:
      APP_ENV: staging
      APP_VERSION: 4.2.1
      DEPLOYMENT_ENV: staging
      AUTO_MIGRATE: "false"
      SCHEMA_GATE_ENABLED: "true"
      WORKFLOW_ENABLED: "true"
      RESEARCH_SCHEDULER_ENABLED: "false"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data/staging-output:/app/data/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build: .
    env_file:
      - .env.supabase-staging
    environment:
      APP_ENV: staging
      APP_VERSION: 4.2.1
      DEPLOYMENT_ENV: staging
      AUTO_MIGRATE: "false"
      WORKFLOW_ENABLED: "true"
      WORKFLOW_POLL_SECONDS: "0.5"
      RESEARCH_SCHEDULER_ENABLED: "false"
    command: ["python", "-m", "app.workflows.worker"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data/staging-output:/app/data/output

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8001
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: http://localhost:8001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
