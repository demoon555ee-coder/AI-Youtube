services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: youtube_ai
      POSTGRES_USER: youtube_ai
      POSTGRES_PASSWORD: youtube_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_ai -d youtube_ai"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      WORKFLOW_ENABLED: "false"
      APP_VERSION: "4.2.4"
      DATABASE_URL: postgresql+asyncpg://youtube_ai:youtube_ai@db:5432/youtube_ai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    env_file: .env
    environment:
      WORKFLOW_ENABLED: "true"
      APP_VERSION: "4.2.4"
      DATABASE_URL: postgresql+asyncpg://youtube_ai:youtube_ai@db:5432/youtube_ai
    command: ["python", "-m", "app.workflows.worker"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
