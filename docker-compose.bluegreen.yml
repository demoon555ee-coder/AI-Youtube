services:
  migrate:
    image: ${API_IMAGE_REF:-ghcr.io/example/youtube-ai-platform-api:${RELEASE_TAG:-4.2.1}}
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_VERSION: ${RELEASE_TAG:-4.2.1}
      RELEASE_ID: ${RELEASE_ID:-local}
      AUTO_MIGRATE: "false"
      MIGRATION_ONLY: "true"
    command: ["python", "scripts/migrate.py"]
    networks: [production_net]

  api_blue:
    image: ${API_IMAGE_REF:-ghcr.io/example/youtube-ai-platform-api:${RELEASE_TAG:-4.2.1}}
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_VERSION: ${RELEASE_TAG:-4.2.1}
      AUTO_MIGRATE: "false"
      SCHEMA_GATE_ENABLED: "true"
      DEPLOYMENT_ENV: production
    ports: ["127.0.0.1:8002:8000"]
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    networks: [production_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  api_green:
    image: ${API_IMAGE_REF:-ghcr.io/example/youtube-ai-platform-api:${RELEASE_TAG:-4.2.1}}
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_VERSION: ${RELEASE_TAG:-4.2.1}
      AUTO_MIGRATE: "false"
      SCHEMA_GATE_ENABLED: "true"
      DEPLOYMENT_ENV: production
    ports: ["127.0.0.1:8003:8000"]
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    networks: [production_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  web_blue:
    image: ${WEB_IMAGE_REF:-ghcr.io/example/youtube-ai-platform-web:${RELEASE_TAG:-4.2.1}}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    ports: ["127.0.0.1:3002:3000"]
    networks: [production_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  web_green:
    image: ${WEB_IMAGE_REF:-ghcr.io/example/youtube-ai-platform-web:${RELEASE_TAG:-4.2.1}}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    ports: ["127.0.0.1:3003:3000"]
    networks: [production_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

networks:
  production_net:
    name: ${PRODUCTION_NETWORK:-youtube-ai-platform_default}
    external: true
