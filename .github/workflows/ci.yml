name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - run: chmod +x scripts/*.sh scripts/rotate_encryption_keys.py
      - run: python -m compileall -q app
      - run: pytest -q
      - run: python scripts/full_audit.py
      - run: python scripts/validate_env.py
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - run: node scripts/frontend_ast_check.mjs
      - working-directory: frontend
        run: npm run build

  integration:
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        postgres-version: ['15', '16']
    runs-on: ubuntu-latest
    env:
      REQUIRE_INTEGRATION: "true"
      TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-integration.txt
      - run: chmod +x scripts/*.sh
      - run: ./scripts/run_integration_tests.sh

  staging_e2e:
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare executable release scripts
        run: chmod +x scripts/*.sh scripts/rotate_encryption_keys.py
      - name: Prepare staging environment
        run: |
          cp .env.staging.example .env.staging
          mkdir -p data/staging-output
      - name: Build staging stack
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging build
      - name: Start staging stack
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
      - name: Health smoke test
        run: ./scripts/staging_smoke.sh
      - name: Remotion runtime smoke test
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T api npm --prefix /app/app/remotion run smoke
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Static parse of E2E TypeScript
        working-directory: e2e
        run: node check_ast.mjs
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: e2e
        env:
          WEB_BASE_URL: http://127.0.0.1:3001
          CI: true
        run: npm run test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Collect staging logs
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging logs --no-color > staging-compose.log
      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-compose-log
          path: staging-compose.log
      - name: Tear down staging
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging down -v


  release_audit:
    needs: [backend, frontend, integration, staging_e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/*.sh scripts/rotate_encryption_keys.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Resolve current application version
        id: version
        run: echo "version=$(python -c 'from app.config import settings; print(settings.app_version)')" >> "$GITHUB_OUTPUT"
      - name: Create release manifest
        run: python scripts/create_release_manifest.py "${{ steps.version.outputs.version }}" -o RELEASE_MANIFEST.json
      - name: Verify release manifest
        run: python scripts/verify_release_manifest.py RELEASE_MANIFEST.json --expected-tag "${{ steps.version.outputs.version }}"
      - name: Validate recovery assets
        run: |
          test -x scripts/restore_drill.sh
          test -x scripts/verify_backup.sh
          test -f docker-compose.bluegreen.yml

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEXT_PUBLIC_API_BASE != ''
    needs: [backend, frontend, integration, staging_e2e, release_audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/youtube-ai-platform-api
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate frontend public API base for immutable production image
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_API_BASE"
          case "$NEXT_PUBLIC_API_BASE" in https://*) ;; *) echo "NEXT_PUBLIC_API_BASE must use https in production"; exit 1;; esac
      - uses: docker/metadata-action@v5
        id: webmeta
        with:
          images: ghcr.io/${{ github.repository_owner }}/youtube-ai-platform-web
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.NEXT_PUBLIC_API_BASE }}
          tags: ${{ steps.webmeta.outputs.tags }}
          labels: ${{ steps.webmeta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max