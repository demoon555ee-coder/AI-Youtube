name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to deploy
        required: true
        type: string
      api_image_ref:
        description: Digest-pinned API image reference, e.g. ghcr.io/org/youtube-ai-platform-api@sha256:...
        required: true
        type: string
      web_image_ref:
        description: Digest-pinned Web image reference, e.g. ghcr.io/org/youtube-ai-platform-web@sha256:...
        required: true
        type: string
      environment:
        description: Protected deployment environment name
        required: true
        default: production
        type: environment

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag
        shell: bash
        run: |
          [[ "${{ inputs.release_tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Create release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m pip install -r requirements.txt -q
          python scripts/create_release_manifest.py "$RELEASE_TAG" -o RELEASE_MANIFEST.json --api-image-ref "${{ inputs.api_image_ref }}" --web-image-ref "${{ inputs.web_image_ref }}" --previous-tag ""
          python scripts/verify_release_manifest.py RELEASE_MANIFEST.json --expected-tag "$RELEASE_TAG"
      - name: Verify release tooling
        run: test -x scripts/rollback_blue_green.sh
      - name: Deploy over SSH
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/youtube-ai-platform-api
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/youtube-ai-platform-web
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          PROXY_RELOAD_CMD: ${{ secrets.PROXY_RELOAD_CMD }}
          ACTIVE_SLOT_FILE: /opt/youtube-ai-platform/state/active_slot
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp RELEASE_MANIFEST.json "$DEPLOY_USER@$DEPLOY_HOST:/opt/youtube-ai-platform/RELEASE_MANIFEST.json"
          printf '%s\n' "$REGISTRY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/youtube-ai-platform && RELEASE_TAG='$RELEASE_TAG' API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' ./scripts/deploy_blue_green.sh '$RELEASE_TAG' RELEASE_MANIFEST.json .env.production docker-compose.bluegreen.yml"
